# .gate.conf — push-gate for joplin-dictate-plugin
#
# Keeps package.json and src/manifest.json versions in lockstep, and blocks
# pushes that fail to build. See ~/Projects/push-gate/.gate.conf.example.
# {VERSION} is substituted with the version read from GATE_VERSION_SOURCE.

# ── Version source ──────────────────────────────────────────────────────────
# Canonical version lives in package.json (2-space indented JSON).
GATE_VERSION_SOURCE="package.json"

# Extract the quoted version value. Anchored inside the quotes so the capture
# is ONLY the digits/dots (no trailing quote or comma).
GATE_VERSION_REGEX='^  "version": "([0-9]+\.[0-9]+\.[0-9]+)",'

# ── Version sync targets ────────────────────────────────────────────────────
# "file | match-regex | replacement" — delimiter is '|'.
# NOTE: src/manifest.json is TAB-indented (Joplin's style). We match the
# version *value* rather than the leading whitespace, so the entry is
# robust to tab-vs-space differences (and to push-gate's ERE escaping of \t).
GATE_SYNC=(
    'src/manifest.json|"version": "{VERSION}",|"version": "{VERSION}",'
)

# ── Auto-fix commands ───────────────────────────────────────────────────────
# None needed for this project (no formatter enforced). Add e.g. "npm run lint"
# here if you adopt one.
GATE_AUTO_FIX=()

# ── Must-pass checks ────────────────────────────────────────────────────────
# Must exit 0 AND produce no output (stdout+stderr combined).
# scripts/gate-dist.sh runs the build silently on success (re-runs verbosely
# on failure) so the gate's "no output" rule is satisfied when the build is OK.
GATE_MUST_PASS=(
    "bash scripts/gate-dist.sh"
)
