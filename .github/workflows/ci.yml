name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run push-gate consistency check
        # Uses the shared push-gate tool to verify version sync + build.
        run: |
          git clone --depth=1 https://github.com/NormG/push-gate.git /tmp/push-gate
          /tmp/push-gate/gate check .
